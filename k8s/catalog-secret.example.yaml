apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__WebApiDatabase: REPLACE_WITH_SQL_CONNECTION_STRING
  RabbitMq__Username: REPLACE_WITH_RABBITMQ_USERNAME
  RabbitMq__Password: REPLACE_WITH_RABBITMQ_PASSWORD
