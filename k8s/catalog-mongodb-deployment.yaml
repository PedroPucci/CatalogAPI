apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mongodb
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-mongodb
  template:
    metadata:
      labels:
        app: catalog-mongodb
    spec:
      containers:
        - name: catalog-mongodb
          image: mongo:8
          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"

            - name: MONGO_INITDB_ROOT_PASSWORD
              value: "YourStrongMongoPass"

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: catalog-mongodb-pvc