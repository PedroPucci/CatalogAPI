
name: CatalogAPI CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore test dependencies
        run: dotnet restore CatalogAPI.Tests/CatalogAPI.Tests.csproj

      - name: Build
        run: dotnet build CatalogAPI.Tests/CatalogAPI.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test CatalogAPI.Tests/CatalogAPI.Tests.csproj --configuration Release --no-build --no-restore

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/CatalogAPI/Dockerfile
          push: false
          tags: fcg-catalog-api:${{ github.sha }}
