
services:
  catalogapi:
    build:
      context: .
      dockerfile: src/CatalogAPI/Dockerfile

    image: catalog-api
    container_name: catalog-api

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      RunMigrations: "true"

      ConnectionStrings__WebApiDatabase: "Server=catalog-sqlserver,1433;Database=FCGGameCatalog;User Id=sa;Password=${SQLSERVER_PASSWORD:?Configure SQLSERVER_PASSWORD};TrustServerCertificate=True;Encrypt=False;"

      MongoDbSettings__ConnectionString: "mongodb://root:${MONGO_PASSWORD:?Configure MONGO_PASSWORD}@catalog-mongodb:27017/?authSource=admin"
      MongoDbSettings__DatabaseName: "FCGGameCatalogMongo"

      Redis__ConnectionString: "catalog-redis:6379"

      OpenSearch__Url: "http://catalog-opensearch:9200"

      RabbitMq__Host: "host.docker.internal"
      RabbitMq__Username: "${RABBITMQ_USERNAME:-guest}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD}"

      JwtSettings__Issuer: "PedroIghor"
      JwtSettings__Audience: "https://localhost:5001"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY}"
      JwtSettings__ExpirationInMinutes: "60"

    depends_on:
      catalog-redis:
        condition: service_healthy

      catalog-opensearch:
        condition: service_healthy

    networks:
      - default
      - legacy

    restart: unless-stopped

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - catalog_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - default

    restart: unless-stopped

  catalog-opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: catalog-opensearch

    environment:
      discovery.type: "single-node"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "127.0.0.1:9201:9200"

    volumes:
      - catalog_opensearch_data:/usr/share/opensearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/ >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s

    networks:
      - default

    restart: unless-stopped

volumes:
  catalog_redis_data:
    external: true
    name: catalogapi_catalog_redis_data

  catalog_opensearch_data:
    external: true
    name: catalogapi_catalog_opensearch_data

networks:
  default:
    name: catalogapi_default

  legacy:
    external: true
    name: dockercompose9992594990462220109_default
